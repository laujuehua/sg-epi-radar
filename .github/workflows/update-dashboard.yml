name: Update dashboard

on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC = 09:00 Singapore
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write          # commit refreshed data/processed
  pages: write
  id-token: write

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Check Cloudflare build script
        run: bash -n setup/build-cloudflare.sh

      - uses: actions/cache@v4
        with:
          path: data/extra/raw
          key: ${{ runner.os }}-extra-v1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-extra-v1-

      - name: Refresh supplementary data library
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python -m sgsurv.extra_data

      - name: Fetch data and run pipeline
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional; AI step skips if empty
        run: python -m sgsurv.pipeline --ai

      - name: Refresh briefing headlines
        run: python -m sgsurv.content

      - name: Retain supplementary refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplementary-refresh-status
          path: data/extra/refresh_status.json
          if-no-files-found: ignore

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render dashboard
        run: |
          python -m sgsurv.assets
          quarto render dashboard/index.qmd

      - name: Validate publication data
        run: python -m sgsurv.validate

      - name: Commit refreshed processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/extra/processed data/extra/catalog.json data/extra/refresh_status.json data/reference/briefing.json
          # GITHUB_TOKEN pushes do not retrigger Actions. Avoid skip annotations
          # so the independent Cloudflare Git integration can build fresh data.
          git diff --staged --quiet || git commit -m "Update processed data"
          git pull --rebase origin main
          git push

      - name: Collect site files
        run: python -m sgsurv.site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: sg-epi-radar-site
          path: sg-epi-radar-site.zip


  deploy:
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
